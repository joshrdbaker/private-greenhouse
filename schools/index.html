<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schools — Living Labs | Private Greenhouse</title>
    <meta
      name="description"
      content="Living Labs — educational greenhouses designed, built, and serviced for the way your institution operates."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200..700;1,9..144,300..500&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="landing.css" />
  </head>
  <body id="top" class="schools-landing">
    <a class="landing-brand" href="../" aria-label="Private Greenhouse by TC Control Group">
      <img
        class="landing-brand__logo"
        src="../assets/brand/private-greenhouse-logo-black.png"
        width="3652"
        height="1280"
        alt="Private Greenhouse by TC Control Group">
    </a>

    <section class="landing" aria-label="Schools introduction">
      <div class="landing-sky" aria-hidden="true"></div>
      <div class="landing-inner">
        <div class="landing-copy">
          <p class="landing-eyebrow">Welcome to Living Labs</p>
          <h1 class="landing-title">A better future grows here.</h1>
          <p class="landing-subhead">
            Living Labs is our line of educational greenhouses &mdash; designed, built, and serviced for the way your institution operates. Delivered ready to grow.
          </p>
        </div>

        <div class="landing-visual">
          <div class="landing-oval">
            <div class="landing-oval__frame">
              <img
                class="landing-oval__img"
                src="assets/hero-students.png"
                width="1566"
                height="2100"
                alt="Two students walking toward a campus glasshouse with aquaponics growing systems inside"
              />
            </div>
            <div class="glint landing-oval__glint" aria-hidden="true">
              <span class="glint-c"></span>
              <span class="glint-d"></span>
              <span class="glint-e"></span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
